        <button class="menu-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false" hidden>

        <a class="brand" href="/Portfolio/index.html">Your&nbsp;Name<span class="brand__mark">.</span></a>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="/Portfolio/index.html">Home</a></li>

    <section class="hero">
      <div class="container">
        <p class="hero__eyebrow">404</p>
        <h1>That page got lost.</h1>
        <p class="hero__lede">
          The link may be broken or the page may have moved. Let&rsquo;s get you
          back on track.
        </p>
        <div class="btn-row">
          <a class="btn btn--primary" href="/Portfolio/index.html">Back to home</a>
          <a class="btn btn--ghost" href="/Portfolio/work.html">See the work</a>
